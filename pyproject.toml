[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimivox"
version = "1.1.3"
description = "Real-time JA→EN meeting translator on Apple Silicon via MLX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper",
    # Japanese ASR (Haas-ja, Parakeet-TDT). Not on PyPI; pinned to a reviewed commit.
    "haas-mlx @ git+https://github.com/matsuurajun/haas-mlx@cde96d263f56aad75c1de70282f71a91562092dd",
    "mlx-lm",
    "fastapi",
    "uvicorn",
    "sounddevice",
    "numpy",
    "onnxruntime",
    "sudachipy",
    "sudachidict_small",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "sacrebleu>=2.4",
    "ruff>=0.8",
]

[project.scripts]
mimivox = "mimivox.cli:main"
mimivox-server = "mimivox.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mimivox = ["lexicon/*", "silero/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# The formatter owns code width; long string literals and comments stay as written.
# zip(strict=) would turn silent truncation into a runtime error; opt in per call.
ignore = ["E501", "B905"]


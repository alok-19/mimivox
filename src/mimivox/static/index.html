<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MimiVox | Live JA→EN Translator</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --accent2: #3fb950;
      --dim: #8b949e;
      --text: #e6edf3;
      --partial: #6e7681;
      --danger: #f85149;
      --warn: #d29922;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
      flex: 1;
    }

    header h1 span {
      color: var(--accent);
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dim);
      flex-shrink: 0;
    }

    #status-dot.live {
      background: var(--accent2);
      box-shadow: 0 0 6px var(--accent2);
      animation: pulse 1.5s ease infinite;
    }

    #status-dot.error {
      background: var(--danger);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    #status-label {
      font-size: 12px;
      color: var(--dim);
      min-width: 80px;
    }

    #privacy-badge {
      margin-left: auto;
      font-size: 12px;
      color: var(--accent2);
      white-space: nowrap;
    }

    #privacy-badge.open {
      color: #d29922;
    }

    #elapsed {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--dim);
      min-width: 52px;
      text-align: right;
    }

    /* ── Controls ─────────────────────────────────────────────────── */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 13px;
      color: var(--dim);
    }

    #wav-input {
      flex: 1;
      min-width: 200px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      color: var(--text);
      font-family: var(--font-mono);
      outline: none;
    }

    #wav-input:focus {
      border-color: var(--accent);
    }

    #device-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      color: var(--text);
      font-family: var(--font-ui);
      outline: none;
      min-width: 140px;
      cursor: pointer;
    }

    #device-select:focus {
      border-color: var(--accent);
    }

    button {
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    #btn-start {
      background: #238636;
      border-color: #238636;
      color: #fff;
    }

    #btn-start:hover {
      background: #2ea043;
      border-color: #2ea043;
    }

    #btn-start:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #btn-stop {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
    }

    #btn-stop:hover {
      background: rgba(248, 81, 73, 0.12);
    }

    #btn-stop:disabled {
      opacity: 0.3;
      cursor: default;
    }

    #btn-export {
      background: transparent;
      color: var(--accent);
      border-color: var(--accent);
    }

    #btn-export:hover {
      background: rgba(88, 166, 255, 0.1);
    }

    #btn-clear {
      background: transparent;
      color: var(--dim);
      border-color: var(--border);
    }

    #btn-clear:hover {
      color: var(--text);
      border-color: var(--dim);
    }

    /* ── Subtitle feed ────────────────────────────────────────────── */
    #feed {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--dim);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Subtitle card ────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card.partial {
      border-color: #21262d;
      background: #0d1117;
      opacity: 0.7;
    }

    .card-meta {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--dim);
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
    }

    .badge.spk {
      cursor: pointer;
      font-weight: 600;
      color: #0d1117;
    }

    .badge.asr {
      color: #79c0ff;
    }

    .badge.cat {
      color: #56d364;
    }

    .badge.tot {
      color: var(--warn);
    }

    .badge.revised {
      font-style: italic;
      opacity: 0.7;
    }

    .badge.conf {
      cursor: help;
      opacity: 0.8;
    }
    .badge.conf.medium { color: var(--warn); }
    .badge.conf.low { color: #e5534b; font-weight: 600; }

    .badge.partial-tag {
      color: var(--partial);
    }

    .badge.translating-tag {
      color: var(--accent);
    }

    @keyframes blink {
      50% {
        opacity: 0.3;
      }
    }

    .badge.translating-tag {
      animation: blink 1s step-end infinite;
    }

    .ja {
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 6px;
      color: var(--text);
      font-weight: 500;
    }

    /* learning mode: furigana over kanji, gloss on hover */
    .ja ruby rt { font-size: 0.5em; color: var(--partial); font-weight: 400; }
    .ja .w { position: relative; border-radius: 3px; }
    .ja .w[data-tip]:hover { background: rgba(120, 160, 255, 0.18); cursor: help; }
    .ja .w[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute; left: 0; top: 100%; z-index: 10; margin-top: 4px;
      width: max-content; max-width: 260px; white-space: pre-line;
      padding: 6px 9px; border-radius: 6px; font-size: 13px; font-weight: 400; line-height: 1.4;
      background: #2d333b; color: #e6edf3; border: 1px solid #444c56; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }

    .en {
      font-size: 15px;
      line-height: 1.5;
      color: #adbac7;
    }

    /* partial card shows only JA in muted colour */
    .card.partial .ja {
      color: var(--partial);
      font-size: 16px;
    }

    /* streamed EN preview during ASR — muted, italic, clearly provisional */
    .card.partial .en.en-preview {
      color: var(--partial);
      font-size: 15px;
      font-style: italic;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* ── Status bar ───────────────────────────────────────────────── */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    #chunk-count {
      font-size: 12px;
      color: var(--dim);
      font-family: var(--font-mono);
    }

    #avg-latency {
      font-size: 12px;
      color: var(--dim);
      font-family: var(--font-mono);
    }

    #conn-status {
      font-size: 12px;
      margin-left: auto;
    }

    #conn-status.connected {
      color: var(--accent2);
    }

    #conn-status.disconnected {
      color: var(--dim);
    }

    #conn-status.error {
      color: var(--danger);
    }
  </style>
</head>

<body>

  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <header>
    <h1>MimiVox <span>JA → EN</span></h1>
    <div id="status-dot"></div>
    <span id="status-label">idle</span>
    <span id="privacy-badge" title="Checking privacy status…">On-device</span>
    <span id="elapsed">00:00</span>
  </header>

  <!-- ── Controls ────────────────────────────────────────────────────── -->
  <div class="controls">
    <label for="wav-input">WAV file</label>
    <input id="wav-input" type="text" placeholder="/path/to/meeting.wav  (leave empty for live mic)"
      spellcheck="false" />
    <label for="device-select" id="device-label" style="display:none;">Device</label>
    <select id="device-select" style="display:none;"></select>
    <label for="pair-select">Language</label>
    <select id="pair-select" title="Spoken language → caption language"></select>
    <button id="btn-start">▶ Start</button>
    <button id="btn-stop" disabled>■ Stop</button>
    <button id="btn-export">↓ Export MD</button>
    <button id="btn-clear">✕ Clear</button>
  </div>

  <!-- ── Subtitle feed ────────────────────────────────────────────────── -->
  <div id="feed">
    <div class="empty-state">
      <div class="icon">🎙️</div>
      <p>Enter a WAV path and click <strong>Start</strong>,<br>or leave blank for live microphone.</p>
    </div>
  </div>

  <!-- ── Footer ──────────────────────────────────────────────────────── -->
  <footer>
    <span id="chunk-count">0 chunks</span>
    <span id="avg-latency">avg —</span>
    <span id="conn-status" class="disconnected">● SSE disconnected</span>
  </footer>

  <script>
    const API_TOKEN = (() => {
      const fragment = new URLSearchParams(location.hash.slice(1));
      const sharedToken = fragment.get('token');
      if (sharedToken) {
        sessionStorage.setItem('mimivox:api-token', sharedToken);
        history.replaceState(null, '', location.pathname + location.search);
        return sharedToken;
      }
      return sessionStorage.getItem('mimivox:api-token') || '';
    })();

    function apiFetch(input, init = {}) {
      const headers = new Headers(init.headers || {});
      headers.set('Authorization', `Bearer ${API_TOKEN}`);
      return fetch(input, { ...init, headers });
    }

    /* ── State ─────────────────────────────────────────────────────────── */
    let sseController = null;
    let sseRetryTimer = null;
    let sessionLog = [];        // {ts, ja, en, asr_ms, translate_ms, total_ms}
    let totalMs = 0;
    let chunkCount = 0;
    let partialCard = null;      // DOM element of current partial card
    let translatingCard = null;  // DOM element of card receiving streamed EN tokens
    let elapsedSec = 0;
    let elapsedTimer = null;
    let partialJaAccum = "";     // accumulated partial JA text this utterance

    /* ── Privacy badge: "On-device · offline" plus the retention policy ── */
    const RETENTION_LABELS = {
      forever: 'kept forever', '30d': 'kept 30 days', '7d': 'kept 7 days',
      '1d': 'kept 1 day', none: 'not saved',
    };
    async function refreshPrivacyBadge() {
      const badge = document.getElementById('privacy-badge');
      try {
        const p = (await (await apiFetch('/api/status')).json()).privacy;
        if (!p) return;
        const lock = p.offline_locked ? 'On-device · offline' : 'On-device · downloads allowed';
        badge.textContent = `🔒 ${lock} · ${RETENTION_LABELS[p.retention_policy] || p.retention_policy}`;
        badge.classList.toggle('open', !p.offline_locked);
        badge.title = p.network_egress_enabled
          ? 'Model downloads are allowed: ' + p.egress_paths.join(', ')
          : 'Models are local and network access is locked off.';
      } catch (e) { /* server unreachable: keep the last text */ }
    }
    refreshPrivacyBadge();
    setInterval(refreshPrivacyBadge, 15000);

    /* ── DOM refs ──────────────────────────────────────────────────────── */
    const feed = document.getElementById('feed');
    const statusDot = document.getElementById('status-dot');
    const statusLabel = document.getElementById('status-label');
    const elapsedEl = document.getElementById('elapsed');
    const chunkCountEl = document.getElementById('chunk-count');
    const avgLatEl = document.getElementById('avg-latency');
    const connEl = document.getElementById('conn-status');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const btnExport = document.getElementById('btn-export');
    const btnClear = document.getElementById('btn-clear');
    const wavInput = document.getElementById('wav-input');
    const deviceSelect = document.getElementById('device-select');
    const pairSelect = document.getElementById('pair-select');

    /* Language pairs: ja-en is the default; others need the optional translation model. */
    (async () => {
      try {
        const data = await (await apiFetch('/api/languages')).json();
        for (const p of data.pairs) {
          const opt = document.createElement('option');
          opt.value = p.code;
          opt.textContent = p.label + (p.ready ? '' : ' (model not downloaded)');
          pairSelect.appendChild(opt);
        }
        pairSelect.value = data.selected.source + '-' + data.selected.target;
      } catch (e) {
        pairSelect.innerHTML = '<option value="ja-en">日本語 → English</option>';
      }
    })();
    const deviceLabel = document.getElementById('device-label');

    /* ── SSE connection ────────────────────────────────────────────────── */
    async function connectSSE() {
      if (sseController) sseController.abort();
      if (sseRetryTimer) clearTimeout(sseRetryTimer);

      const controller = new AbortController();
      sseController = controller;
      try {
        const response = await apiFetch('/stream', { signal: controller.signal });
        if (response.status === 401) {
          connEl.textContent = '● Open the current browser link from the server terminal';
          connEl.className = 'error';
          return;
        }
        if (!response.ok || !response.body) throw new Error('SSE request failed');
        connEl.textContent = '● SSE connected';
        connEl.className = 'connected';

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (!controller.signal.aborted) {
          const { value, done } = await reader.read();
          if (done) throw new Error('SSE stream ended');
          buffer += decoder.decode(value, { stream: true });
          let boundary;
          while ((boundary = buffer.indexOf('\n\n')) !== -1) {
            const frame = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            const data = frame.split(/\r?\n/)
              .filter(line => line.startsWith('data: '))
              .map(line => line.slice(6))
              .join('\n');
            if (!data) continue;
            let event;
            try { event = JSON.parse(data); } catch { continue; }
            handleEvent(event);
          }
        }
      } catch (error) {
        if (controller.signal.aborted) return;
        connEl.textContent = '● SSE error — retrying';
        connEl.className = 'error';
        sseRetryTimer = setTimeout(() => {
          if (sseController === controller) connectSSE();
        }, 1000);
      }
    }

    /* ── Event handler ─────────────────────────────────────────────────── */
    const cardsById = new Map();  // pipeline utterance id -> card element

    function handleEvent(ev) {
      if (ev.kind === 'session_start') {
        setStatus('live', '● live');
        startElapsedTimer();
        // Remove empty-state if present
        feed.querySelector('.empty-state')?.remove();
        partialJaAccum = '';
        partialCard = null;
        return;
      }

      if (ev.kind === 'session_end') {
        setStatus('', 'idle');
        stopElapsedTimer();
        btnStart.disabled = false;
        btnStop.disabled = true;
        partialCard = null;
        translatingCard = null;
        return;
      }

      if (ev.kind === 'partial') {
        // Backend sends full utterance accum; assign (do not re-append).
        partialJaAccum = ev.ja || '';
        if (!partialCard) {
          // Create a new partial card
          partialCard = createCard({
            ts: ev.ts,
            ja: partialJaAccum,
            partial: true,
          });
          feed.appendChild(partialCard);
        } else {
          // Update existing partial card's JA text
          partialCard.querySelector('.ja').textContent = partialJaAccum;
        }
        scrollFeed();
        return;
      }

      if (ev.kind === 'partial_en_token') {
        // Streamed EN preview token during ASR — append to the partial card.
        if (partialCard) {
          let enEl = partialCard.querySelector('.en');
          if (!enEl) {
            enEl = document.createElement('div');
            enEl.className = 'en en-preview';
            partialCard.appendChild(enEl);
          }
          enEl.textContent += ev.text || '';
          scrollFeed();
        }
        return;
      }

      if (ev.kind === 'partial_en') {
        // Finalized EN preview for the partial — replace accumulated tokens.
        if (partialCard) {
          let enEl = partialCard.querySelector('.en');
          if (!enEl) {
            enEl = document.createElement('div');
            enEl.className = 'en en-preview';
            partialCard.appendChild(enEl);
          }
          enEl.textContent = ev.en || '';
          scrollFeed();
        }
        return;
      }

      if (ev.kind === 'translating') {
        // ASR done, translation starting — remove partial card, create translating shell
        if (partialCard) { partialCard.remove(); partialCard = null; }
        partialJaAccum = '';
        translatingCard = createCard({ ts: ev.ts, ja: ev.ja, translating: true });
        feed.appendChild(translatingCard);
        scrollFeed();
        return;
      }

      if (ev.kind === 'en_token') {
        // Append streamed English token to the active translating card
        if (translatingCard) {
          let enEl = translatingCard.querySelector('.en');
          if (!enEl) {
            enEl = document.createElement('div');
            enEl.className = 'en';
            translatingCard.appendChild(enEl);
          }
          enEl.textContent += ev.text;
          scrollFeed();
        }
        return;
      }

      if (ev.kind === 'speaker_renamed') {
        applySpeakerRename(ev.speaker);
        return;
      }

      if (ev.kind === 'revision') {
        // A sentence the VAD split was retranslated as one line: rewrite the
        // earlier card in place and drop the shell made for the later half.
        if (translatingCard) { translatingCard.remove(); translatingCard = null; }
        if (partialCard) { partialCard.remove(); partialCard = null; }
        partialJaAccum = '';
        const target = cardsById.get(ev.target_id);
        if (target) {
          setJa(target.querySelector('.ja'), ev.ja, ev.tokens);
          let enEl = target.querySelector('.en');
          if (!enEl) {
            enEl = document.createElement('div');
            enEl.className = 'en';
            target.appendChild(enEl);
          }
          enEl.textContent = ev.en;
          if (!target.querySelector('.badge.revised')) {
            const tag = document.createElement('span');
            tag.className = 'badge revised';
            tag.textContent = 'revised';
            tag.title = 'Retranslated after the next phrase continued this sentence';
            target.querySelector('.card-meta').appendChild(tag);
          }
          setConfidenceBadge(target, ev.confidence);
        }
        const logged = sessionLog.find(e => e.id === ev.target_id);
        if (logged) { logged.ja = ev.ja; logged.en = ev.en; logged.confidence = ev.confidence; }
        return;
      }

      if (ev.kind === 'final') {
        if (translatingCard) {
          // Streaming path: finalize the existing translating card with latency badges + clean EN
          finalizeCard(translatingCard, ev);
          if (ev.id != null) cardsById.set(ev.id, translatingCard);
          translatingCard = null;
        } else {
          // Cache-hit path: no streaming, build card from scratch
          if (partialCard) { partialCard.remove(); partialCard = null; }
          partialJaAccum = '';
          const card = createCard({
            ts: ev.ts, ja: ev.ja, en: ev.en,
            asr_ms: ev.asr_ms, translate_ms: ev.translate_ms, total_ms: ev.total_ms,
            speaker: ev.speaker, confidence: ev.confidence, tokens: ev.tokens,
          });
          feed.appendChild(card);
          if (ev.id != null) cardsById.set(ev.id, card);
          scrollFeed();
        }

        // Update stats
        chunkCount++;
        totalMs += ev.total_ms;
        sessionLog.push(ev);
        chunkCountEl.textContent = `${chunkCount} chunk${chunkCount !== 1 ? 's' : ''}`;
        const avg = (totalMs / chunkCount / 1000).toFixed(2);
        avgLatEl.textContent = `avg ${avg}s`;
      }
    }

    /* ── Confidence marker: only medium/low get one; reasons in the tooltip ─ */
    function setConfidenceBadge(card, conf) {
      const meta = card.querySelector('.card-meta');
      const old = meta.querySelector('.badge.conf');
      if (old) old.remove();
      if (!conf || (conf.level !== 'medium' && conf.level !== 'low')) return;
      const badge = document.createElement('span');
      badge.className = `badge conf ${conf.level}`;
      badge.textContent = conf.level === 'low' ? '? check' : '? unsure';
      badge.title = `${conf.level} confidence: ` + (conf.reasons || []).join('; ');
      meta.appendChild(badge);
    }

    /* ── Speaker chip: stable colour per id, click to rename ───────────── */
    function speakerChip(sp) {
      const chip = document.createElement('span');
      chip.className = 'badge spk';
      chip.dataset.speakerId = sp.id;
      chip.title = 'Click to rename';
      chip.textContent = sp.label;
      const n = parseInt(sp.id.replace(/\D/g, ''), 10) || 1;
      chip.style.background = `hsl(${(n * 137) % 360}, 65%, 70%)`;
      chip.addEventListener('click', async () => {
        const label = prompt('Rename speaker', chip.textContent);
        if (!label || !label.trim()) return;
        await apiFetch('/api/session/speakers/rename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: sp.id, label: label.trim() }),
        });
      });
      return chip;
    }

    function applySpeakerRename(sp) {
      document.querySelectorAll('.badge.spk').forEach(c => {
        if (c.dataset.speakerId === sp.id) c.textContent = sp.label;
      });
      for (const ev of sessionLog) {
        if (ev.speaker && ev.speaker.id === sp.id) ev.speaker.label = sp.label;
      }
    }

    /* ── Finalize a translating card with latency badges and clean EN text ─ */
    /* JA line: plain text, or (learning mode) words with furigana and a gloss tip.
       Tokens are used only when they spell the text exactly. */
    function setJa(el, ja, tokens) {
      el.textContent = '';
      if (!Array.isArray(tokens) || !tokens.length || tokens.map(t => t.surface).join('') !== ja) {
        el.textContent = ja || '';
        return;
      }
      for (const t of tokens) {
        const w = document.createElement('span');
        w.className = 'w';
        if (t.gloss || t.reading) {
          w.dataset.tip = (t.base || t.surface) + (t.reading ? `  ${t.reading}` : '') + (t.gloss ? `\n${t.gloss}` : '');
        }
        if (t.reading) {
          const ruby = document.createElement('ruby');
          ruby.appendChild(document.createTextNode(t.surface));
          const rt = document.createElement('rt');
          rt.textContent = t.reading;
          ruby.appendChild(rt);
          w.appendChild(ruby);
        } else {
          w.textContent = t.surface;
        }
        el.appendChild(w);
      }
    }

    function finalizeCard(card, ev) {
      setJa(card.querySelector('.ja'), ev.ja, ev.tokens);
      const meta = card.querySelector('.card-meta');
      meta.querySelectorAll('.badge').forEach(b => b.remove());
      if (ev.speaker) meta.appendChild(speakerChip(ev.speaker));

      const asrBadge = document.createElement('span');
      asrBadge.className = 'badge asr';
      asrBadge.textContent = `ASR ${(ev.asr_ms / 1000).toFixed(2)}s`;

      const catBadge = document.createElement('span');
      catBadge.className = 'badge cat';
      catBadge.textContent = `CAT ${(ev.translate_ms / 1000).toFixed(2)}s`;

      const totBadge = document.createElement('span');
      totBadge.className = 'badge tot';
      totBadge.textContent = `total ${(ev.total_ms / 1000).toFixed(2)}s`;

      meta.appendChild(asrBadge);
      meta.appendChild(catBadge);
      meta.appendChild(totBadge);
      setConfidenceBadge(card, ev.confidence);

      // Lock in the clean EN text (clean_cat_output may differ from raw tokens)
      let enEl = card.querySelector('.en');
      if (!enEl) {
        enEl = document.createElement('div');
        enEl.className = 'en';
        card.appendChild(enEl);
      }
      enEl.textContent = ev.en;
      card.classList.remove('partial');
    }

    /* ── Create card element ───────────────────────────────────────────── */
    function createCard({ ts, ja, en, asr_ms, translate_ms, total_ms, partial, translating, speaker, confidence, tokens }) {
      const card = document.createElement('div');
      card.className = 'card' + (partial || translating ? ' partial' : '');

      const meta = document.createElement('div');
      meta.className = 'card-meta';
      card.appendChild(meta);

      const tsSpan = document.createElement('span');
      tsSpan.textContent = `[${ts}]`;
      meta.appendChild(tsSpan);
      if (speaker) meta.appendChild(speakerChip(speaker));

      if (translating) {
        const ttag = document.createElement('span');
        ttag.className = 'badge translating-tag';
        ttag.textContent = '⟳ translating';
        meta.appendChild(ttag);
      } else if (partial) {
        const ptag = document.createElement('span');
        ptag.className = 'badge partial-tag';
        ptag.textContent = '⟳ partial';
        meta.appendChild(ptag);
      } else if (asr_ms != null) {
        const asrBadge = document.createElement('span');
        asrBadge.className = 'badge asr';
        asrBadge.textContent = `ASR ${(asr_ms / 1000).toFixed(2)}s`;

        const catBadge = document.createElement('span');
        catBadge.className = 'badge cat';
        catBadge.textContent = `CAT ${(translate_ms / 1000).toFixed(2)}s`;

        const totBadge = document.createElement('span');
        totBadge.className = 'badge tot';
        totBadge.textContent = `total ${(total_ms / 1000).toFixed(2)}s`;

        meta.appendChild(asrBadge);
        meta.appendChild(catBadge);
        meta.appendChild(totBadge);
        setConfidenceBadge(card, confidence);
      }

      const jaEl = document.createElement('div');
      jaEl.className = 'ja';
      setJa(jaEl, ja, tokens);

      card.appendChild(jaEl);

      if (!partial && !translating && en) {
        const enEl = document.createElement('div');
        enEl.className = 'en';
        enEl.textContent = en;
        card.appendChild(enEl);
      }

      return card;
    }

    /* ── Scroll feed to bottom ─────────────────────────────────────────── */
    function scrollFeed() {
      feed.scrollTo({ top: feed.scrollHeight, behavior: 'smooth' });
    }

    /* ── Status helpers ────────────────────────────────────────────────── */
    function setStatus(dotClass, label) {
      statusDot.className = dotClass;
      statusLabel.textContent = label;
    }

    function startElapsedTimer() {
      stopElapsedTimer();
      elapsedSec = 0;
      elapsedTimer = setInterval(() => {
        elapsedSec++;
        const m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
        const s = String(elapsedSec % 60).padStart(2, '0');
        elapsedEl.textContent = `${m}:${s}`;
      }, 1000);
    }

    function stopElapsedTimer() {
      if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    }

    /* ── Device dropdown ───────────────────────────────────────────────── */
    async function loadDevices() {
      try {
        const resp = await apiFetch('/devices');
        const data = await resp.json();
        const devices = data.devices || [];
        deviceSelect.innerHTML = '';
        if (devices.length === 0) {
          deviceSelect.style.display = 'none';
          deviceLabel.style.display = 'none';
          return;
        }
        devices.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d.name;
          opt.textContent = d.name;
          deviceSelect.appendChild(opt);
        });
        // Auto-select BlackHole if available, else first device
        const saved = localStorage.getItem('mimivox:lastDevice');
        const names = devices.map(d => d.name);
        if (saved && names.includes(saved)) {
          deviceSelect.value = saved;
        } else {
          const bh = devices.find(d => /blackhole/i.test(d.name));
          deviceSelect.value = bh ? bh.name : devices[0].name;
        }
        updateDeviceVisibility();
      } catch (e) {
        deviceSelect.style.display = 'none';
        deviceLabel.style.display = 'none';
      }
    }

    function updateDeviceVisibility() {
      const show = !wavInput.value.trim();
      deviceSelect.style.display = show ? '' : 'none';
      deviceLabel.style.display = show ? '' : 'none';
    }

    deviceSelect.addEventListener('change', () => {
      localStorage.setItem('mimivox:lastDevice', deviceSelect.value);
    });

    wavInput.addEventListener('input', updateDeviceVisibility);

    /* ── Buttons ───────────────────────────────────────────────────────── */
    btnStart.addEventListener('click', async () => {
      const wav = wavInput.value.trim() || null;
      const live = !wav;

      btnStart.disabled = true;
      btnStop.disabled = false;
      chunkCount = 0; totalMs = 0;
      chunkCountEl.textContent = '0 chunks';
      avgLatEl.textContent = 'avg —';

      const body = { action: 'start', live };
      const [sourceLang, targetLang] = (pairSelect.value || 'ja-en').split('-');
      body.source_lang = sourceLang;
      body.target_lang = targetLang;
      if (wav) body.wav = wav;
      else body.device = deviceSelect.value;

      const resp = await apiFetch('/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await resp.json();

      if (data.status !== 'started' && data.status !== 'already_running') {
        alert('Error: ' + (data.detail || data.status));
        btnStart.disabled = false;
        btnStop.disabled = true;
      }
    });

    btnStop.addEventListener('click', async () => {
      await apiFetch('/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'stop' }),
      });
      btnStart.disabled = false;
      btnStop.disabled = true;
      setStatus('', 'stopped');
      stopElapsedTimer();
    });

    btnClear.addEventListener('click', () => {
      feed.innerHTML = '';
      sessionLog = [];
      cardsById.clear();
      chunkCount = 0; totalMs = 0;
      chunkCountEl.textContent = '0 chunks';
      avgLatEl.textContent = 'avg —';
      elapsedEl.textContent = '00:00';
      partialCard = null;
      partialJaAccum = '';
      translatingCard = null;
    });

    btnExport.addEventListener('click', () => {
      if (!sessionLog.length) { alert('No session data to export.'); return; }

      const lines = ['# Meeting Transcript', '', `Generated: ${new Date().toISOString()}`, ''];
      for (const ev of sessionLog) {
        lines.push(`## [${ev.ts}]${ev.speaker ? ' ' + ev.speaker.label : ''}`);
        lines.push(`**JA:** ${ev.ja}`);
        lines.push(`**EN:** ${ev.en}`);
        lines.push(`*ASR ${(ev.asr_ms / 1000).toFixed(2)}s · CAT ${(ev.translate_ms / 1000).toFixed(2)}s · total ${(ev.total_ms / 1000).toFixed(2)}s*`);
        lines.push('');
      }

      const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `transcript_${new Date().toISOString().slice(0, 16).replace('T', '_')}.md`;
      a.click();
      URL.revokeObjectURL(url);
    });

    /* ── Boot ──────────────────────────────────────────────────────────── */
    connectSSE();
    loadDevices();

    // Pre-fill WAV path if it's a local demo
    wavInput.value = 'data/fixtures/youtube-sample.wav';
    updateDeviceVisibility();
  </script>
</body>

</html>
